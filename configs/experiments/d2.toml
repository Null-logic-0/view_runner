# Experiment D2 - with retries
#
# Identical to D1 except max_attempts = 3. What does retrying buy?

[target]
url = "http://127.0.0.1:8500/exp-d2"
expected_status = 200

[session]
count = 12
duration_seconds = 2
wait_until = "load"

[browser]
headless = true
user_agent = "browser-automation-lab/0.1.0"

[runner]
concurrency = 4

[proxy]
enabled = true
file = "proxies.local.txt"
default_scheme = "http"

[telemetry]
level = "WARNING"
format = "text"
results_dir = "results"

[failure]
max_attempts = 3
retry_backoff_seconds = 0.25
abort_after_consecutive_failures = 0
